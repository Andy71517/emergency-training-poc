scenario_id: blocked_exit_hallway_v0
scenario_version: "0.1.0"
ruleset_version: "0.1.0"
disclaimer: "POC rule checks only. Not clinical validation, operational guidance, or protocol authority."

rules:
  - id: known-action-only
    severity: error
    when:
      action_type_not_in_scenario_allowed_actions: true
    result:
      code: unknown_action
      message: "This action name is not part of the blocked-exit hallway POC scenario."
      instructor_note: "For the demo, this means the backend rejected an action outside the agreed message contract."
      blocks_transition: true

  - id: scene-assessment-first
    severity: warning
    when:
      state.scene_assessed: false
      action_type_in:
        - scan_hallway
        - confirm_ppe
        - request_backup
        - communicate_status
        - check_visibility
        - identify_secondary_exit
        - move_obstacle
        - check_exit_door
        - open_exit_door
        - monitor_environment
        - guide_occupant_to_exit
    result:
      code: assessment_not_recorded
      message: "Scene assessment has not been recorded yet."
      instructor_note: "This is a POC reminder that the trainee should first record awareness of the scene before the backend accepts hallway or exit actions."
      blocks_transition: true

  - id: hallway-scan-before-environment-work
    severity: warning
    when:
      state.scene_assessed: true
      state.hallway_scanned: false
      action_type_in:
        - check_visibility
        - identify_secondary_exit
        - move_obstacle
        - check_exit_door
        - open_exit_door
        - monitor_environment
        - guide_occupant_to_exit
    result:
      code: hallway_scan_not_recorded
      message: "The hallway scan cue has not been recorded before acting on the exit path."
      instructor_note: "This helps the review show whether the trainee noticed hallway conditions before working with doors, obstacles, or exit guidance."
      blocks_transition: true

  - id: guide-prerequisites
    severity: error
    when:
      action_type: guide_occupant_to_exit
      any_state_equals:
        ppe_confirmed: false
        backup_requested: false
    result:
      code: guide_prerequisites_missing
      message: "The POC setup flags required before guiding the occupant are incomplete."
      instructor_note: "The backend blocked occupant guidance because one or more basic setup flags were still false in the toy scenario state."
      blocks_transition: true

  - id: communication-before-guidance
    severity: warning
    when:
      action_type: guide_occupant_to_exit
      state.scene_assessed: true
      state.hallway_scanned: true
      state.ppe_confirmed: true
      state.backup_requested: true
      state.status_communicated: false
    result:
      code: status_not_communicated
      message: "The status communication cue has not been recorded before guiding the occupant."
      instructor_note: "This gives the review a clear place to discuss communication as a tracked POC cue."
      blocks_transition: true

  - id: visibility-before-guidance
    severity: warning
    when:
      action_type: guide_occupant_to_exit
      state.scene_assessed: true
      state.hallway_scanned: true
      state.ppe_confirmed: true
      state.backup_requested: true
      state.status_communicated: true
      state.visibility_checked: false
    result:
      code: visibility_not_checked
      message: "The hallway visibility cue has not been checked before guidance."
      instructor_note: "This warning keeps visibility cues visible in review without pretending to model real smoke behavior."
      blocks_transition: true

  - id: secondary-exit-before-guidance
    severity: warning
    when:
      action_type: guide_occupant_to_exit
      state.scene_assessed: true
      state.hallway_scanned: true
      state.ppe_confirmed: true
      state.backup_requested: true
      state.status_communicated: true
      state.visibility_checked: true
      state.secondary_exit_identified: false
    result:
      code: secondary_exit_not_identified
      message: "The secondary exit cue has not been identified before guidance."
      instructor_note: "This is a deterministic cue for route awareness, not real operational exit-selection guidance."
      blocks_transition: true

  - id: obstacle-cleared-before-guidance
    severity: warning
    when:
      action_type: guide_occupant_to_exit
      state.scene_assessed: true
      state.hallway_scanned: true
      state.ppe_confirmed: true
      state.backup_requested: true
      state.status_communicated: true
      state.visibility_checked: true
      state.secondary_exit_identified: true
      state.primary_exit_blocked: true
    result:
      code: exit_obstacle_not_cleared
      message: "The primary exit obstacle is still marked as blocking the path."
      instructor_note: "The review should show that an environmental obstacle remained unresolved before exit guidance was attempted."
      blocks_transition: true

  - id: exit-door-check-before-open
    severity: warning
    when:
      action_type: open_exit_door
      state.scene_assessed: true
      state.hallway_scanned: true
      state.exit_door_checked: false
    result:
      code: exit_door_check_not_recorded
      message: "The exit door was opened before the POC door check cue was recorded."
      instructor_note: "This is not a real door tactic. It only shows that the backend can notice a skipped door-condition cue."
      blocks_transition: true

  - id: exit-door-open-before-guidance
    severity: warning
    when:
      action_type: guide_occupant_to_exit
      state.scene_assessed: true
      state.hallway_scanned: true
      state.ppe_confirmed: true
      state.backup_requested: true
      state.status_communicated: true
      state.visibility_checked: true
      state.secondary_exit_identified: true
      state.primary_exit_blocked: false
      state.exit_door_open: false
    result:
      code: exit_door_not_open
      message: "The exit door is not open before guidance."
      instructor_note: "Door state is backend metadata in this slice, so this warning is about state tracking, not real door tactics."
      blocks_transition: true

  - id: environment-monitor-before-guidance
    severity: warning
    when:
      action_type: guide_occupant_to_exit
      state.scene_assessed: true
      state.hallway_scanned: true
      state.ppe_confirmed: true
      state.backup_requested: true
      state.status_communicated: true
      state.visibility_checked: true
      state.secondary_exit_identified: true
      state.primary_exit_blocked: false
      state.exit_door_open: true
      state.environment_monitored: false
    result:
      code: environment_not_monitored
      message: "The ongoing hallway environment cue has not been checked before guidance."
      instructor_note: "This keeps changing environmental cues visible in the review without pretending to simulate smoke, heat, or sensors."
      blocks_transition: true
