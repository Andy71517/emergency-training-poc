scenario_id: smoke_inhalation_room_v0
scenario_version: "0.1.0"
ruleset_version: "0.1.0"
disclaimer: "POC rule checks only. Not clinical validation, operational guidance, or protocol authority."

rules:
  - id: known-action-only
    severity: error
    when:
      action_type_not_in_scenario_allowed_actions: true
    result:
      code: unknown_action
      message: "This action name is not part of the POC scenario."
      blocks_transition: true

  - id: scene-assessment-first
    severity: warning
    when:
      state.scene_assessed: false
      action_type_in: [confirm_ppe, request_backup]
    result:
      code: assessment_not_recorded
      message: "Scene assessment has not been recorded yet."
      blocks_transition: true

  - id: entry-prerequisites
    severity: error
    when:
      action_type: enter_room
      any_state_equals:
        ppe_confirmed: false
        backup_requested: false
    result:
      code: entry_prerequisites_missing
      message: "The POC setup flags required before room entry are incomplete."
      blocks_transition: true

  - id: removal-requires-entry
    severity: error
    when:
      action_type: remove_occupant
      state.phase_not: room_entered
    result:
      code: room_not_entered
      message: "The scenario has not recorded room entry yet."
      blocks_transition: true
