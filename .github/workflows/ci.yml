name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend-checks:
    name: Backend and repo checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check backend scripts

      - name: Compile Python files
        run: python -m compileall -q backend scripts docs/presentations/build_pdf.py

      - name: Check JSON files
        run: python scripts/check_json_files.py

