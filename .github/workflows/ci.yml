name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend-checks:
    name: Backend and repo checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q backend/tests arc/tests

      - name: Run Ruff
        run: python -m ruff check backend scripts

      - name: Compile Python files
        run: python -m compileall -q backend scripts arc/scripts unreal/scripts docs/presentations/build_pdf.py

      - name: Check ARC shell syntax
        run: for file in arc/scripts/*.sh arc/jobs/*.sbatch; do bash -n "$file"; done

      - name: Check JSON files
        run: python scripts/check_json_files.py

  frontend-checks:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web run build

