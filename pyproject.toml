[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emergency-training-poc"
version = "0.0.1"
description = "Deterministic emergency-training simulator proof of concept"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "pyyaml>=6.0,<7.0",
  "uvicorn[standard]>=0.30,<1.0",
  "truststore>=0.10,<1.0; sys_platform == 'win32'",
  "imageio-ffmpeg>=0.6,<0.7",
  "mcp==1.30.0",
  "coacd==1.0.14",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "jsonschema>=4.0,<5.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "websockets>=13.0,<16.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

