scenario_id: smoke_inhalation_room_v0
title: "POC: Smoke Inhalation Room"
version: "0.1.0"
disclaimer: >-
  Illustrative deterministic software scenario only; not medically or operationally authoritative.

initial_state:
  phase: awaiting_assessment
  scene_assessed: false
  ppe_confirmed: false
  backup_requested: false
  occupant_removed: false
  scenario_outcome: in_progress

allowed_actions:
  - assess_scene
  - confirm_ppe
  - request_backup
  - enter_room
  - remove_occupant
  - stop_scenario

transition_rules:
  - id: assess-scene
    when:
      phase: awaiting_assessment
      action_type: assess_scene
    set:
      phase: scene_assessed
      scene_assessed: true

  - id: confirm-ppe
    when:
      scene_assessed: true
      action_type: confirm_ppe
    set:
      ppe_confirmed: true

  - id: request-backup
    when:
      scene_assessed: true
      action_type: request_backup
    set:
      backup_requested: true

  - id: enter-room-after-prerequisites
    when:
      scene_assessed: true
      ppe_confirmed: true
      backup_requested: true
      action_type: enter_room
    set:
      phase: room_entered

  - id: remove-occupant
    when:
      phase: room_entered
      action_type: remove_occupant
    set:
      phase: occupant_removed
      occupant_removed: true
      scenario_outcome: completed

  - id: stop-scenario
    when:
      action_type: stop_scenario
    set:
      phase: stopped
      scenario_outcome: stopped

validation_hints:
  - rule_id: scene-assessment-first
    description: "Flag actions taken before the scene assessment fixture step."
  - rule_id: entry-prerequisites
    description: "Reject room entry until both POC prerequisite flags are true."
  - rule_id: known-action-only
    description: "Reject action types absent from allowed_actions."

end_conditions:
  - state_equals:
      scenario_outcome: completed
    label: completed
  - state_equals:
      scenario_outcome: stopped
    label: stopped

expected_happy_path:
  - assess_scene
  - confirm_ppe
  - request_backup
  - enter_room
  - remove_occupant

possible_unsafe_or_warning_paths:
  - actions: [enter_room]
    expected_validation: fail
    reason: "POC prerequisite flags have not been set."
  - actions: [assess_scene, enter_room]
    expected_validation: fail
    reason: "PPE and backup fixture steps are missing."
  - actions: [confirm_ppe]
    expected_validation: warning
    reason: "Scene assessment fixture step was skipped."
